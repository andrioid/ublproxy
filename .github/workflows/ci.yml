name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./...

  diagrams:
    # Only checks that every .mmd source renders. The SVGs themselves are
    # built at deploy time (pages.yml), so there's nothing to compare against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Keep in sync with mise.toml and pages.yml
      - run: npm install -g @mermaid-js/mermaid-cli@12.2.0
      - name: Render diagrams
        # ubuntu-latest restricts unprivileged user namespaces via AppArmor,
        # so Chrome's sandbox can't start. Rendering our own .mmd files on a
        # throwaway runner doesn't need it.
        run: |
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          for src in web/arch-*.mmd; do
            out="$RUNNER_TEMP/$(basename "${src%.mmd}").svg"
            mmdc -i "$src" -o "$out" -c web/mermaid-config.json -p "$RUNNER_TEMP/puppeteer.json" -b transparent
          done
